<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Løbeøkonomi</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b1220" id="themeColorMeta">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Løbeøkonomi">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root{
    --accent:#0ea5e9;
    --accent-2:#15803d;
    --danger:#dc2626;
    --chart-line:#0284c7;
  }
  :root, [data-theme="dark"]{
    --bg:#0b1220;
    --card:#131b2b;
    --card-2:#1b2740;
    --text:#eef2f7;
    --muted:#8b98ab;
    --border:#253552;
  }
  [data-theme="light"]{
    --bg:#f2f5f9;
    --card:#ffffff;
    --card-2:#eef1f6;
    --text:#111827;
    --muted:#5b6472;
    --border:#dbe2ea;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    display:flex;
    flex-direction:column;
    height:100vh;
    overflow:hidden;
  }
  .wrap{max-width:900px;margin:0 auto;}

  .topbar{
    flex:0 0 auto;
    background:var(--bg);
    border-bottom:1px solid var(--border);
    padding:10px 16px;
  }
  .topbar-inner{display:flex;align-items:center;gap:10px;}
  .topbar-icon{width:26px;height:26px;border-radius:7px;display:block;}
  .topbar-title{font-weight:700;font-size:1.05rem;}

  .pager{
    flex:1 1 auto;
    min-height:0;
    display:flex;
    overflow-x:auto;
    scroll-snap-type:x mandatory;
    scroll-behavior:smooth;
    -webkit-overflow-scrolling:touch;
  }
  .page{
    flex:0 0 100%;
    min-width:100%;
    scroll-snap-align:start;
    overflow-y:auto;
    padding:16px 16px 40px;
  }

  .bottombar{
    flex:0 0 auto;
    display:flex;
    background:var(--card);
    border-top:1px solid var(--border);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .bottombar-btn{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
    background:none;border:none;color:var(--muted);cursor:pointer;
    padding:8px 4px 10px;font-size:.68rem;font-family:inherit;
  }
  .bottombar-btn .bb-icon{font-size:1.35rem;line-height:1;}
  .bottombar-btn.active{color:var(--accent);}

  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:20px;
    margin-bottom:20px;
  }
  .card h2{
    margin:0 0 4px;font-size:1.05rem;
    display:flex;align-items:center;gap:8px;
  }
  .card .sub{color:var(--muted);font-size:.82rem;margin:0 0 16px;}
  table{width:100%;border-collapse:collapse;font-size:.85rem;}
  th,td{padding:6px 6px;text-align:left;white-space:nowrap;}
  th{color:var(--muted);font-weight:600;font-size:.75rem;text-transform:uppercase;letter-spacing:.03em;border-bottom:1px solid var(--border);}
  tbody tr{border-bottom:1px solid var(--border);}
  tbody tr:last-child{border-bottom:none;}
  tbody tr.today-row{background:color-mix(in srgb, var(--accent) 10%, transparent);}
  input[type=text], input[type=date], select{
    background:var(--card-2);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:8px;
    padding:7px 8px;
    font-size:.85rem;
    width:100%;
  }
  input:focus, select:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .empty-state{color:var(--muted);font-size:.85rem;padding:14px 0;text-align:center;}
  .page-order-list{display:flex;flex-direction:column;gap:8px;}
  .page-order-item{
    display:flex;align-items:center;gap:10px;
    background:var(--card-2);border:1px solid var(--border);border-radius:8px;
    padding:6px 8px;font-size:.85rem;
    user-select:none;
  }
  .page-order-item.dragging{
    opacity:.55;box-shadow:0 6px 16px rgba(0,0,0,.3);position:relative;z-index:5;
  }
  .page-order-item .drag-handle{
    cursor:grab;touch-action:none;color:var(--muted);font-size:1.2rem;line-height:1;
    padding:8px 10px;flex-shrink:0;
  }
  .page-order-item .drag-handle:active{cursor:grabbing;}
  .page-order-item .page-order-label{flex:1;}
  .pill{
    display:inline-block;padding:2px 8px;border-radius:999px;font-size:.75rem;font-weight:600;
  }
  .pill.ok{background:color-mix(in srgb, var(--accent-2) 18%, transparent);color:var(--accent-2);}
  .pill.bad{background:color-mix(in srgb, var(--danger) 18%, transparent);color:var(--danger);}
  .pill.neutral{background:color-mix(in srgb, var(--muted) 18%, transparent);color:var(--muted);}
  .icon-btn{
    background:none;border:none;color:var(--muted);cursor:pointer;font-size:1rem;padding:2px 6px;border-radius:6px;
  }
  .icon-btn:hover{color:var(--danger);background:color-mix(in srgb, var(--danger) 10%, transparent);}
  .btn{
    background:var(--accent);
    color:#fff;border:none;border-radius:9px;
    padding:10px 16px;font-size:.88rem;font-weight:600;cursor:pointer;
  }
  .btn:hover{filter:brightness(1.08);}
  .btn.secondary{background:var(--card-2);color:var(--text);border:1px solid var(--border);}
  .btn.small{padding:6px 12px;font-size:.8rem;}
  .actions-row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
  .field label{display:block;font-size:.78rem;color:var(--muted);margin-bottom:5px;}
  .goal-readonly{
    background:var(--card-2);border:1px solid var(--border);border-radius:8px;
    padding:7px 10px;font-size:.85rem;color:var(--text);
  }
  @media(max-width:560px){.grid-2,.grid-3{grid-template-columns:1fr;}}

  .week-nav{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  .week-range-label{font-weight:600;color:var(--accent);font-size:.9rem;min-width:170px;text-align:center;}

  .trips-list{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;}
  .trip-row{display:flex;gap:8px;align-items:center;}
  .trip-row .trip-label{width:64px;color:var(--muted);font-size:.82rem;flex-shrink:0;}
  .trip-row .trip-value{
    flex:1;background:var(--card-2);border:1px solid var(--border);border-radius:8px;
    padding:7px 10px;font-size:.85rem;
  }
  .progress-wrap{margin-top:16px;}
  .progress-bar{height:14px;border-radius:999px;background:var(--card-2);overflow:hidden;border:1px solid var(--border);}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .25s ease;}
  .progress-labels{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);margin-top:6px;}
  .stat-row{display:flex;gap:20px;margin-top:10px;flex-wrap:wrap;}
  .stat{background:var(--card-2);border:1px solid var(--border);border-radius:10px;padding:10px 16px;min-width:110px;}
  .stat .label{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;}
  .stat .value{font-size:1.25rem;font-weight:700;margin-top:2px;}
  .hint{font-size:.75rem;color:var(--muted);margin-top:10px;}
  .conv-pair{display:flex;align-items:center;gap:12px;}
  .conv-pair .field{flex:1;}
  .conv-pair .eq{color:var(--muted);font-size:1.1rem;margin-top:18px;}
  footer{text-align:center;color:var(--muted);font-size:.75rem;margin-top:10px;}

  .toggle-group{display:flex;gap:8px;}
  .toggle-btn{
    flex:1;background:var(--card-2);border:1px solid var(--border);color:var(--text);
    border-radius:9px;padding:10px 14px;font-size:.85rem;font-weight:600;cursor:pointer;
  }
  .toggle-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}

  .chart-svg{width:100%;height:auto;display:block;overflow:visible;}
  .chart-bar, .chart-dot{cursor:pointer;}
  .chart-bar:hover, .chart-dot:hover{opacity:.8;}
  .chart-legend{display:flex;gap:16px;margin-top:10px;font-size:.75rem;color:var(--muted);flex-wrap:wrap;}
  .chart-legend .legend-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;}
  .chart-tooltip{
    position:absolute;display:none;pointer-events:none;z-index:50;
    background:var(--card);border:1px solid var(--border);color:var(--text);
    padding:4px 9px;border-radius:6px;font-size:.75rem;white-space:nowrap;
    box-shadow:0 4px 12px rgba(0,0,0,.25);
  }
</style>
</head>
<body data-theme="dark">

<div class="topbar">
  <div class="topbar-inner">
    <img src="icons/icon-192.png" alt="" class="topbar-icon">
    <span class="topbar-title">Løbeøkonomi</span>
  </div>
</div>

<div class="pager" id="pager">

  <!-- ================= SIDE 1: LOG ================= -->
  <section class="page" data-page="0" data-key="log">
    <div class="wrap">
      <div class="card">
        <h2>📅 <span data-i18n="log_heading"></span></h2>
        <p class="sub" data-i18n="log_sub"></p>
        <div style="overflow-x:auto;">
          <table id="logTable">
            <thead>
              <tr>
                <th data-i18n="log_col_week"></th>
                <th data-i18n="log_col_start"></th>
                <th data-i18n="log_col_end"></th>
                <th data-i18n="log_col_actual"></th>
                <th data-i18n="log_col_increase"></th>
                <th data-i18n="log_col_allowed"></th>
              </tr>
            </thead>
            <tbody id="logBody"></tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <h2>📊 <span data-i18n="overview_heading"></span></h2>
        <p class="sub" data-i18n="overview_sub"></p>
        <div class="stat-row">
          <div class="stat"><div class="label" data-i18n="stat_weeks"></div><div class="value" id="statWeeks">0</div></div>
          <div class="stat"><div class="label" data-i18n="stat_totalkm"></div><div class="value" id="statTotalKm">0 km</div></div>
          <div class="stat"><div class="label" data-i18n="stat_longest_week"></div><div class="value" id="statLongest">0 km</div></div>
          <div class="stat"><div class="label" data-i18n="stat_longest_trip"></div><div class="value" id="statLongestTrip">0 km</div></div>
          <div class="stat"><div class="label" data-i18n="stat_avg_increase"></div><div class="value" id="statAvgIncrease">–</div></div>
        </div>
      </div>

      <div class="card">
        <h2>👟 <span data-i18n="trips_heading"></span></h2>
        <p class="sub" data-i18n="trips_sub"></p>
        <div class="week-nav">
          <button class="btn secondary small" id="prevWeekBtn">←</button>
          <span id="weekRangeLabel" class="week-range-label"></span>
          <button class="btn secondary small" id="nextWeekBtn">→</button>
          <button class="btn secondary small" id="todayWeekBtn" style="margin-left:auto;" data-i18n="week_nav_today"></button>
        </div>
        <div class="grid-2">
          <div class="field">
            <label for="weekGoal" data-i18n="goal_label"></label>
            <input type="text" inputmode="decimal" id="weekGoal" data-i18n-placeholder="goal_placeholder">
            <div class="goal-readonly" id="goalReadonly" style="display:none;"></div>
          </div>
        </div>
        <div class="trips-list" id="tripsList"></div>
        <div class="progress-wrap">
          <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
          <div class="progress-labels">
            <span id="progressPct">0%</span>
            <span id="progressText">0 / 0 km</span>
          </div>
        </div>
        <div class="stat-row">
          <div class="stat"><div class="label" data-i18n="stat_total_done"></div><div class="value" id="totalDone">0 km</div></div>
          <div class="stat"><div class="label" data-i18n="stat_total_left"></div><div class="value" id="totalLeft">0 km</div></div>
        </div>
      </div>
    </div>
  </section>

  <!-- ================= SIDE 2: VÆRKTØJER ================= -->
  <section class="page" data-page="1" data-key="tools">
    <div class="wrap">
      <div class="card">
        <h2>⏱️ <span data-i18n="pace_heading"></span></h2>
        <p class="sub" data-i18n="pace_sub"></p>
        <div class="grid-3">
          <div class="field">
            <label for="paceInput" data-i18n="pace_label"></label>
            <input type="text" id="paceInput" data-i18n-placeholder="pace_placeholder">
          </div>
          <div class="field">
            <label for="timeInput" data-i18n="time_label"></label>
            <input type="text" id="timeInput" data-i18n-placeholder="time_placeholder">
          </div>
          <div class="field">
            <label for="distInput" data-i18n="dist_label"></label>
            <input type="text" id="distInput" data-i18n-placeholder="dist_placeholder">
          </div>
        </div>
        <div class="actions-row">
          <button class="btn small" id="calcDist" data-i18n="btn_calc_dist"></button>
          <button class="btn small" id="calcTime" data-i18n="btn_calc_time"></button>
          <button class="btn small" id="calcPace" data-i18n="btn_calc_pace"></button>
          <button class="btn secondary small" id="clearPace" data-i18n="btn_clear"></button>
        </div>
        <p class="hint" id="paceError"></p>
      </div>

      <div class="card">
        <h2>🔄 <span data-i18n="convert_heading"></span></h2>
        <p class="sub" data-i18n="convert_sub"></p>
        <div class="conv-pair" style="margin-bottom:16px;">
          <div class="field">
            <label for="kmField" data-i18n="km_label"></label>
            <input type="text" id="kmField" data-i18n-placeholder="km_placeholder">
          </div>
          <div class="eq">=</div>
          <div class="field">
            <label for="milesField" data-i18n="miles_label"></label>
            <input type="text" id="milesField" data-i18n-placeholder="miles_placeholder">
          </div>
        </div>
        <div class="conv-pair">
          <div class="field">
            <label for="paceKmField" data-i18n="pace_km_label"></label>
            <input type="text" id="paceKmField" data-i18n-placeholder="pace_km_placeholder">
          </div>
          <div class="eq">=</div>
          <div class="field">
            <label for="paceMileField" data-i18n="pace_mile_label"></label>
            <input type="text" id="paceMileField" data-i18n-placeholder="pace_mile_placeholder">
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ================= SIDE 3: INDSTILLINGER ================= -->
  <section class="page" data-page="2" data-key="settings">
    <div class="wrap">
      <div class="card">
        <h2>🔗 <span data-i18n="strava_heading"></span></h2>
        <p class="sub" data-i18n="strava_sub"></p>
        <div class="actions-row">
          <button class="btn" id="stravaConnectBtn" data-i18n="btn_strava_connect"></button>
          <button class="btn secondary small" id="stravaSyncBtn" style="display:none;" data-i18n="btn_strava_sync"></button>
          <button class="btn secondary small" id="stravaDisconnectBtn" style="display:none;" data-i18n="btn_strava_disconnect"></button>
        </div>
        <p class="hint" id="stravaStatus"></p>
      </div>

      <div class="card">
        <h2>💾 <span data-i18n="data_heading"></span></h2>
        <p class="sub" data-i18n="data_sub"></p>
        <div class="actions-row">
          <button class="btn secondary small" id="exportBtn" data-i18n="btn_export"></button>
          <button class="btn secondary small" id="importBtn" data-i18n="btn_import"></button>
          <input type="file" id="importFile" accept="application/json" style="display:none;">
        </div>
        <p class="hint" id="importStatus"></p>
      </div>

      <div class="card">
        <h2>🌐 <span data-i18n="lang_heading"></span></h2>
        <p class="sub" data-i18n="lang_sub"></p>
        <div class="toggle-group">
          <button class="toggle-btn" id="langDaBtn">Dansk</button>
          <button class="toggle-btn" id="langEnBtn">English</button>
        </div>
      </div>

      <div class="card">
        <h2>🎨 <span data-i18n="theme_heading"></span></h2>
        <p class="sub" data-i18n="theme_sub"></p>
        <div class="toggle-group">
          <button class="toggle-btn" id="themeLightBtn" data-i18n="theme_light"></button>
          <button class="toggle-btn" id="themeDarkBtn" data-i18n="theme_dark"></button>
        </div>
      </div>

      <div class="card">
        <h2>↕️ <span data-i18n="page_order_heading"></span></h2>
        <p class="sub" data-i18n="page_order_sub"></p>
        <div id="pageOrderList" class="page-order-list"></div>
      </div>

      <div class="card">
        <h2>📅 <span data-i18n="log_settings_heading"></span></h2>
        <p class="sub" data-i18n="log_settings_sub"></p>
        <div class="field">
          <label for="logWeeksLimit" data-i18n="log_weeks_limit_label"></label>
          <select id="logWeeksLimit">
            <option value="4">4</option>
            <option value="8">8</option>
            <option value="12">12</option>
            <option value="26">26</option>
            <option value="52">52</option>
            <option value="all" data-i18n="log_weeks_limit_all"></option>
          </select>
        </div>
      </div>

      <div class="card">
        <h2>📈 <span data-i18n="chart_settings_heading"></span></h2>
        <p class="sub" data-i18n="chart_settings_sub"></p>
        <div class="grid-2">
          <div class="field">
            <label for="chartFromDate" data-i18n="chart_from_label"></label>
            <input type="date" id="chartFromDate">
          </div>
          <div class="field">
            <label for="chartToDate" data-i18n="chart_to_label"></label>
            <input type="date" id="chartToDate">
          </div>
        </div>
        <div class="actions-row">
          <button class="btn secondary small" id="chartRangeResetBtn" data-i18n="chart_range_reset"></button>
        </div>
      </div>

      <footer data-i18n="footer_text"></footer>
    </div>
  </section>

  <!-- ================= SIDE 4: GRAFER ================= -->
  <section class="page" data-page="3" data-key="charts">
    <div class="wrap">
      <div class="card">
        <h2>📈 <span data-i18n="chart_weekly_heading"></span></h2>
        <p class="sub" data-i18n="chart_weekly_sub"></p>
        <div id="weeklyChart"></div>
        <div class="chart-legend">
          <span><i class="legend-dot" style="background:var(--accent-2)"></i><span data-i18n="chart_legend_ok"></span></span>
          <span><i class="legend-dot" style="background:var(--danger)"></i><span data-i18n="chart_legend_bad"></span></span>
        </div>
      </div>

      <div class="card">
        <h2>📉 <span data-i18n="chart_cumulative_heading"></span></h2>
        <p class="sub" data-i18n="chart_cumulative_sub"></p>
        <div id="cumulativeChart"></div>
      </div>
    </div>
  </section>

</div>

<nav class="bottombar" id="bottomBar">
  <button class="bottombar-btn active" data-page="0" data-key="log">
    <span class="bb-icon">📅</span><span class="bb-label" data-i18n="page_log"></span>
  </button>
  <button class="bottombar-btn" data-page="1" data-key="tools">
    <span class="bb-icon">⏱️</span><span class="bb-label" data-i18n="page_tools"></span>
  </button>
  <button class="bottombar-btn" data-page="2" data-key="settings">
    <span class="bb-icon">⚙️</span><span class="bb-label" data-i18n="page_settings"></span>
  </button>
  <button class="bottombar-btn" data-page="3" data-key="charts">
    <span class="bb-icon">📈</span><span class="bb-label" data-i18n="page_charts"></span>
  </button>
</nav>

<script>
const KM_PER_MILE = 1.609344;
const STORAGE_KEY = "lobeokonomi-data-v1";
const LANG_KEY = "lobeokonomi-lang";
const THEME_KEY = "lobeokonomi-theme";
const LOG_WEEKS_LIMIT_KEY = "lobeokonomi-log-weeks-limit";
const CHART_RANGE_KEY = "lobeokonomi-chart-range";

let logWeeksLimit = localStorage.getItem(LOG_WEEKS_LIMIT_KEY) || "12";
let chartRange = (() => {
  try{
    const saved = JSON.parse(localStorage.getItem(CHART_RANGE_KEY));
    if(saved && typeof saved === "object") return {from: saved.from || null, to: saved.to || null};
  }catch(e){}
  return {from: null, to: null};
})();

// --- Strava-integration: se worker/strava-worker.js ---
const STRAVA_CLIENT_ID = "280932";
const STRAVA_WORKER_URL = "https://running-economy.andreas-m-steiner.workers.dev";

/* ---------- i18n ---------- */
const STRINGS = {
  da: {
    page_log: "Log", page_tools: "Værktøjer", page_settings: "Indstillinger", page_charts: "Grafer",
    log_heading: "Ugentlig log",
    log_sub: "Automatisk opsummering pr. uge ud fra dine Strava-løbeture. Stigning og 10%-grænse beregnes ud fra ugen før.",
    log_col_week: "Uge", log_col_start: "Start dato", log_col_end: "Slut dato",
    log_col_actual: "Faktisk (km)", log_col_increase: "Stigning", log_col_allowed: "Tilladt (+10%)",
    log_empty: "Ingen uger endnu — forbind Strava under Indstillinger for at hente dine løbeture.",
    today_badge: "i dag",

  let s = (STRINGS[lang] && STRINGS[lang][key]) ?? key;
  if(vars) Object.entries(vars).forEach(([k,v]) => { s = s.split(`{${k}}`).join(v); });
  return s;
}
function setLang(newLang){
  lang = newLang;
  localStorage.setItem(LANG_KEY, lang);
  document.documentElement.lang = lang;
  applyStaticTranslations();
  renderAll();
}
function applyStaticTranslations(){
  document.querySelectorAll("[data-i18n]").forEach(el => {
    el.textContent = t(el.dataset.i18n);
  });
  document.querySelectorAll("[data-i18n-placeholder]").forEach(el => {

  document.getElementById("langEnBtn").classList.toggle("active", lang === "en");
}

/* ---------- Dato-hjælpere ---------- */
function toDateStr(d){
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth()+1).padStart(2,"0");
  const dd = String(d.getDate()).padStart(2,"0");
  return `${yyyy}-${mm}-${dd}`;
}
function addDays(dateStr, days){
  const d = new Date(dateStr + "T00:00:00");
  d.setDate(d.getDate() + days);
  return toDateStr(d);
}
function toMonday(dateStr){
  const d = new Date(dateStr + "T00:00:00");
  const day = d.getDay(); // 0=søn,1=man,...6=lør
  const diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  return toDateStr(d);
}
function formatDate(dateStr){
  const [y,m,d] = dateStr.split("-");
  return `${d}/${m}/${y}`;
}
function formatShortDate(dateStr){
  const [, m, d] = dateStr.split("-");
  return `${d}/${m}`;
}
// ISO 8601-ugenummer (samme som ugenr.dk) for en given dato.
function isoWeekNumber(dateStr){
  const d = new Date(dateStr + "T00:00:00");
  const dayNr = (d.getDay() + 6) % 7; // mandag=0 ... søndag=6
  const thursday = new Date(d);
  thursday.setDate(d.getDate() - dayNr + 3);
  const firstThursday = new Date(thursday.getFullYear(), 0, 4);
  const firstDayNr = (firstThursday.getDay() + 6) % 7;
  firstThursday.setDate(firstThursday.getDate() - firstDayNr + 3);
  return 1 + Math.round((thursday - firstThursday) / (7*24*3600*1000));
}
function parseDecimal(str){
  if(str === null || str === undefined) return null;
  const s = String(str).trim().replace(",", ".");
  if(s === "") return null;
  const v = parseFloat(s);
  return isNaN(v) ? null : v;
}

const CURRENT_WEEK_START = toMonday(toDateStr(new Date()));

/* ---------- Data ---------- */
function loadData(){
  let data = null;
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) data = JSON.parse(raw);
  }catch(e){}
  if(!data) data = { tripsByWeek: {} };
  if(!data.tripsByWeek) data.tripsByWeek = {};

  // migrer ældre format (globalt mål/ture uden ugenøgle)
  if(data.goal !== undefined || data.trips !== undefined){
    if(!data.tripsByWeek[CURRENT_WEEK_START]){
      data.tripsByWeek[CURRENT_WEEK_START] = { goal: data.goal ?? null, trips: data.trips ?? [] };
    }
    delete data.goal;
    delete data.trips;
  }

  // migrer ældre "Ugentlig log"-format (manuelt tastede uger) ind som ture
  if(Array.isArray(data.weeks)){
    data.weeks.forEach(w => {
      if(!w.start) return;
      const existing = data.tripsByWeek[w.start];
      const hasTripData = existing && existing.trips.some(t => t !== null && t !== undefined && t !== "");
      if(!hasTripData && w.actual !== null && w.actual !== undefined && w.actual !== ""){
        if(!data.tripsByWeek[w.start]) data.tripsByWeek[w.start] = { goal: null, trips: [] };
        data.tripsByWeek[w.start].trips.push(w.actual);
      }
    });
    delete data.weeks;
  }

  // fjern tomme pladsholdere - der er ikke længere manuel indtastning
  Object.values(data.tripsByWeek).forEach(week => {
    week.trips = week.trips.filter(t => t !== null && t !== undefined && t !== "");
  });

  if(!data.strava){
    data.strava = {accessToken:null, refreshToken:null, expiresAt:null, athleteName:null, importedIds:[]};
  }
  return data;
}
let data = loadData();

function saveData(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function ensureWeek(weekStart){
  if(!data.tripsByWeek[weekStart]){
    data.tripsByWeek[weekStart] = {goal: null, trips: []};
  }
  return data.tripsByWeek[weekStart];
}
let viewedWeekStart = CURRENT_WEEK_START;
function viewedWeek(){ return ensureWeek(viewedWeekStart); }

// En tur er enten en ren værdi (ældre/manuelt migreret data, ingen dato)
// eller {value, date} (importeret fra Strava, med dato for turen).
function tripValue(t){
  if(t === null || t === undefined) return null;
  return (typeof t === "object") ? t.value : t;
}
function tripDate(t){
  return (t && typeof t === "object") ? t.date : null;
}
function weekTripsTotal(weekStart){
  const w = data.tripsByWeek[weekStart];
  if(!w) return null;
  const nums = w.trips.map(t => parseDecimal(tripValue(t))).filter(v => v !== null);
  if(nums.length === 0) return null;
  return nums.reduce((s,v) => s+v, 0);
}

/* ---------- 1. Ugentlig log (afledt af Strava-data) ---------- */
function getLoggedWeekKeys(){
  return Object.keys(data.tripsByWeek)
    .filter(k => weekTripsTotal(k) !== null)
    .sort();
}

// Sammenhængende ugerække (ingen huller) fra den første uge med data til nu,
// så uger uden løbeture (0 km) også vises i stedet for bare at forsvinde.
function getWeekRange(){
  const logged = getLoggedWeekKeys();
  if(logged.length === 0) return [];
  const range = [];
  let cursor = logged[0];
  while(cursor <= CURRENT_WEEK_START){
    range.push(cursor);
    cursor = addDays(cursor, 7);
  }
  return range;
}

// Uger til grafernes visning: samme sammenhængende rækkefølge, men begrænset
// til den periode brugeren har valgt under Indstillinger.
function getChartWeekRange(){
  let range = getWeekRange();
  if(chartRange.from) range = range.filter(k => k >= chartRange.from);
  if(chartRange.to) range = range.filter(k => k <= chartRange.to);
  return range;
}

function renderLog(){
  const body = document.getElementById("logBody");
  body.innerHTML = "";
  const range = getWeekRange(); // kronologisk (ældst → nyest)

  if(range.length === 0){
    const tr = document.createElement("tr");
    tr.innerHTML = `<td colspan="6" class="empty-state">${t("log_empty")}</td>`;
    body.appendChild(tr);
    updateOverallStats();
    return;
  }

  const values = range.map(k => weekTripsTotal(k) ?? 0);
  const limit = logWeeksLimit === "all" ? range.length : Math.min(parseInt(logWeeksLimit, 10), range.length);
  const startIdx = range.length - limit;

  // Nyeste uge øverst, begrænset til de seneste `limit` uger
  for(let i = range.length - 1; i >= startIdx; i--){
    const weekStart = range[i];
    const actual = values[i];
    const prevActual = i > 0 ? values[i-1] : null;
    const end = addDays(weekStart, 6);
    const isToday = weekStart === CURRENT_WEEK_START;

    let pctHtml = '<span class="pill neutral">–</span>';
    let allowedHtml = '<span class="pill neutral">–</span>';
    if(prevActual !== null && prevActual > 0){
      allowedHtml = `<span class="pill neutral">${(prevActual*1.1).toFixed(2)} km</span>`;
      const pct = (actual/prevActual - 1) * 100;
      const cls = pct <= 10.0001 ? "ok" : "bad";
      pctHtml = `<span class="pill ${cls}">${pct >= 0 ? "+" : ""}${pct.toFixed(1)}%</span>`;
    }

    const tr = document.createElement("tr");
    if(isToday) tr.classList.add("today-row");
    tr.innerHTML = `
      <td>${isoWeekNumber(weekStart)}${isToday ? ` <span class="pill ok">${t("today_badge")}</span>` : ""}</td>
      <td>${formatDate(weekStart)}</td>
      <td>${formatDate(end)}</td>
      <td>${actual.toFixed(2)}</td>
      <td>${pctHtml}</td>
      <td>${allowedHtml}</td>
    `;
    body.appendChild(tr);
  }
  updateOverallStats();
}

function updateOverallStats(){
  const keys = getLoggedWeekKeys();
  const actuals = keys.map(k => weekTripsTotal(k));
  const totalKm = actuals.reduce((s,v) => s+v, 0);
  const longest = actuals.length ? Math.max(...actuals) : 0;

  let increases = [];
  keys.forEach((k, i) => {
    if(i === 0) return;
    const prev = actuals[i-1];
    if(prev > 0) increases.push((actuals[i]/prev - 1) * 100);
  });
  const avgIncrease = increases.length ? increases.reduce((s,v) => s+v, 0) / increases.length : null;

  const allTrips = Object.values(data.tripsByWeek).flatMap(w => w.trips.map(t => parseDecimal(tripValue(t)))).filter(v => v !== null);
  const longestTrip = allTrips.length ? Math.max(...allTrips) : 0;

  document.getElementById("statWeeks").textContent = actuals.length;
  document.getElementById("statTotalKm").textContent = totalKm.toFixed(2) + " km";
  document.getElementById("statLongest").textContent = longest.toFixed(2) + " km";
  document.getElementById("statLongestTrip").textContent = longestTrip.toFixed(2) + " km";
  document.getElementById("statAvgIncrease").textContent =
    avgIncrease === null ? "–" : (avgIncrease >= 0 ? "+" : "") + avgIncrease.toFixed(1) + "%";
}

/* ---------- 2. Ugens ture (read-only, fra Strava) ---------- */
function renderTrips(){
  const end = addDays(viewedWeekStart, 6);
  document.getElementById("weekRangeLabel").textContent =
    `${formatDate(viewedWeekStart)} – ${formatDate(end)}`;

  const week = viewedWeek();
  const goalInput = document.getElementById("weekGoal");
  const goalReadonly = document.getElementById("goalReadonly");
  const isPast = viewedWeekStart < CURRENT_WEEK_START;
  if(isPast){
    const total = week.trips.reduce((sum, tr) => sum + (parseDecimal(tripValue(tr)) || 0), 0);
    const goalVal = parseDecimal(week.goal);
    goalReadonly.textContent = goalVal !== null
      ? `${total.toFixed(2)} / ${goalVal.toFixed(2)} km`
      : `${total.toFixed(2)} km (${t("goal_not_set")})`;
    goalInput.style.display = "none";
    goalReadonly.style.display = "";
  } else {
    goalInput.value = week.goal ?? "";
    goalInput.style.display = "";
    goalReadonly.style.display = "none";
  }
  const list = document.getElementById("tripsList");
  list.innerHTML = "";

  if(week.trips.length === 0){
    list.innerHTML = `<div class="empty-state">${t("trips_empty")}</div>`;
  } else {
    week.trips.forEach((trip, i) => {
      const row = document.createElement("div");
      row.className = "trip-row";
      const date = tripDate(trip);
      const label = date ? formatShortDate(date) : t("trip_generic", {n: i+1});
      const value = tripValue(trip);
      row.innerHTML = `
        <span class="trip-label" title="${date ? formatDate(date) : ""}">${label}</span>
        <span class="trip-value">${value} km</span>
        <button class="icon-btn" data-del="${i}" title="${t("trip_delete_title")}">✕</button>
      `;
      list.appendChild(row);
    });
    list.querySelectorAll("[data-del]").forEach(btn => {
      btn.addEventListener("click", e => {
        const i = parseInt(e.target.dataset.del);
        const trip = viewedWeek().trips[i];
        const date = tripDate(trip);
        const label = date ? formatDate(date) : t("trip_generic", {n: i+1});
        if(!confirm(t("trip_delete_confirm", {label}))) return;
        viewedWeek().trips.splice(i,1);
        saveData();
        renderAll();
      });
    });
  }
  updateTripStats();
}

function updateTripStats(){
  const week = viewedWeek();
  const total = week.trips.reduce((sum, t) => sum + (parseDecimal(tripValue(t)) || 0), 0);
  const goal = parseDecimal(week.goal) || 0;
  const left = goal - total;
  const pct = goal > 0 ? Math.min(100, (total/goal)*100) : 0;

  document.getElementById("totalDone").textContent = total.toFixed(2) + " km";
  document.getElementById("totalLeft").textContent = (goal > 0 ? left.toFixed(2) : "0") + " km";
  document.getElementById("progressFill").style.width = pct.toFixed(1) + "%";
  document.getElementById("progressPct").textContent = pct.toFixed(0) + "%";
  document.getElementById("progressText").textContent = `${total.toFixed(2)} / ${goal.toFixed(2)} km`;

  const leftEl = document.getElementById("totalLeft");

function showChartTooltip(evt, text){

function renderWeeklyChart(){
  const container = document.getElementById("weeklyChart");
  if(!container) return;
  const range = getChartWeekRange();
  if(range.length === 0){
    container.innerHTML = `<div class="empty-state">${t("charts_empty")}</div>`;
    return;
  }
  const values = range.map(k => weekTripsTotal(k) ?? 0);
  const max = Math.max(...values, 1);

  const W = 600, H = 220, padL = 32, padB = 22, padT = 10, padR = 8;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const gap = 4;
  const barW = Math.max(3, plotW / range.length - gap);

  const okColor = cssVar("--accent-2");
  const badColor = cssVar("--danger");
  const neutralColor = cssVar("--muted");
  const gridColor = cssVar("--border");
  const textColor = cssVar("--muted");

  let gridSvg = "";
  for(let i=0;i<=3;i++){
    const y = padT + plotH - (plotH*i/3);
    const val = max*i/3;
    gridSvg += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="${gridColor}" stroke-width="1"/>`;
    gridSvg += `<text x="${padL-5}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="8" fill="${textColor}">${val.toFixed(0)}</text>`;
  }

  const labelEvery = Math.max(1, Math.ceil(range.length / 12));
  let barsSvg = "";
  range.forEach((weekStart, i) => {
    const val = values[i];
    const prevVal = i > 0 ? values[i-1] : null;
    let color = neutralColor;
    if(prevVal !== null && prevVal > 0){
      const pct = (val/prevVal - 1) * 100;
      color = pct <= 10.0001 ? okColor : badColor;
    }
    const barH = max > 0 ? (val/max) * plotH : 0;
    const x = padL + i * (barW + gap);
    const y = padT + plotH - barH;
    barsSvg += `<rect class="chart-bar" data-week="${weekStart}" data-val="${val.toFixed(2)}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(barH,1).toFixed(1)}" rx="3" fill="${color}"></rect>`;
    if(i % labelEvery === 0 || i === range.length-1){
      barsSvg += `<text x="${(x+barW/2).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="8" fill="${textColor}">${isoWeekNumber(weekStart)}</text>`;
    }
  });

  container.innerHTML = `<svg viewBox="0 0 ${W} ${H}" class="chart-svg" preserveAspectRatio="xMidYMid meet">${gridSvg}${barsSvg}</svg>`;

  container.querySelectorAll(".chart-bar").forEach(bar => {
    bar.addEventListener("mouseenter", evt => {
      showChartTooltip(evt, t("chart_week_tooltip", {week: isoWeekNumber(bar.dataset.week), val: bar.dataset.val}));
    });
    bar.addEventListener("mousemove", evt => showChartTooltip(evt, ensureChartTooltip().textContent));
    bar.addEventListener("mouseleave", hideChartTooltip);
  });
}

function renderCumulativeChart(){
  const container = document.getElementById("cumulativeChart");
  if(!container) return;
  const range = getChartWeekRange();
  if(range.length === 0){
    container.innerHTML = `<div class="empty-state">${t("charts_empty")}</div>`;
    return;
  }
  const values = range.map(k => weekTripsTotal(k) ?? 0);
  let cum = 0;
  const cumValues = values.map(v => (cum += v));
  const max = Math.max(...cumValues, 1);

  const W = 600, H = 220, padL = 38, padB = 22, padT = 10, padR = 8;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const stepX = range.length > 1 ? plotW/(range.length-1) : 0;

  const accent = cssVar("--chart-line");
  const gridColor = cssVar("--border");
  const textColor = cssVar("--muted");

  let gridSvg = "";
  for(let i=0;i<=3;i++){
    const y = padT + plotH - (plotH*i/3);
    const val = max*i/3;
    gridSvg += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="${gridColor}" stroke-width="1"/>`;
    gridSvg += `<text x="${padL-5}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="8" fill="${textColor}">${val.toFixed(0)}</text>`;
  }

  const points = cumValues.map((v,i) => ({
    x: padL + i*stepX,
    y: padT + plotH - (v/max)*plotH,
    v, weekStart: range[i]
  }));
  const pathD = points.map((p,i) => `${i===0?"M":"L"}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ");
  const areaD = `${pathD} L${points[points.length-1].x.toFixed(1)},${(padT+plotH).toFixed(1)} L${points[0].x.toFixed(1)},${(padT+plotH).toFixed(1)} Z`;
  const dotsSvg = points.map(p =>
    `<circle class="chart-dot" data-week="${p.weekStart}" data-val="${p.v.toFixed(2)}" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3" fill="${accent}"></circle>`
  ).join("");

  container.innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" class="chart-svg" preserveAspectRatio="xMidYMid meet">
      ${gridSvg}
      <path d="${areaD}" fill="${accent}" opacity="0.12" stroke="none"></path>
      <path d="${pathD}" fill="none" stroke="${accent}" stroke-width="2"></path>
      ${dotsSvg}
    </svg>`;

  container.querySelectorAll(".chart-dot").forEach(dot => {
    dot.addEventListener("mouseenter", evt => {
      showChartTooltip(evt, t("chart_date_tooltip", {date: formatDate(dot.dataset.week), val: dot.dataset.val}));
    });
    dot.addEventListener("mousemove", evt => showChartTooltip(evt, ensureChartTooltip().textContent));
    dot.addEventListener("mouseleave", hideChartTooltip);
  });
}

  renderCumulativeChart();
}

/* ---------- 3. Pace-beregner ---------- */
function parseMMSS(str){
  if(!str) return null;
  const parts = str.trim().replace(",",".").split(":");
  if(parts.length === 2){
    const m = parseFloat(parts[0]), s = parseFloat(parts[1]);
    if(isNaN(m) || isNaN(s)) return null;
    return m + s/60;
  }
  if(parts.length === 1){
    const v = parseFloat(parts[0]);
    return isNaN(v) ? null : v;
  }
  return null;
}
function parseHHMMSS(str){
  if(!str) return null;
  const parts = str.trim().split(":");
  if(parts.length === 3){
    const h = parseFloat(parts[0]), m = parseFloat(parts[1]), s = parseFloat(parts[2]);
    if([h,m,s].some(isNaN)) return null;
    return h*60 + m + s/60;
  }
  return parseMMSS(str);
}
function formatMMSS(totalMinutes){
  if(totalMinutes === null || isNaN(totalMinutes) || totalMinutes < 0) return "";
  const m = Math.floor(totalMinutes);
  const s = Math.round((totalMinutes - m) * 60);
  const mm = s === 60 ? m+1 : m;
  const ss = s === 60 ? 0 : s;
  return `${mm}:${String(ss).padStart(2,"0")}`;
}
function formatHHMMSS(totalMinutes){
  if(totalMinutes === null || isNaN(totalMinutes) || totalMinutes < 0) return "";
  const totalSeconds = Math.round(totalMinutes*60);
  const h = Math.floor(totalSeconds/3600);
  const m = Math.floor((totalSeconds%3600)/60);
  const s = totalSeconds%60;
  if(h > 0) return `${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  return `${m}:${String(s).padStart(2,"0")}`;
}

function paceError(msg){
  document.getElementById("paceError").textContent = msg;
}

document.getElementById("calcDist").addEventListener("click", () => {
  const pace = parseMMSS(document.getElementById("paceInput").value);
  const time = parseHHMMSS(document.getElementById("timeInput").value);
  if(pace === null || time === null || pace === 0){ paceError(t("err_dist")); return; }
  const dist = time / pace;
  document.getElementById("distInput").value = dist.toFixed(2);

document.getElementById("calcTime").addEventListener("click", () => {

  if(pace === null || dist === null){ paceError(t("err_time")); return; }
  const time = pace * dist;

});
document.getElementById("calcPace").addEventListener("click", () => {

  if(time === null || dist === null || dist === 0){ paceError(t("err_pace")); return; }

function stravaRedirectUri(){

}
function stravaStatusMsg(msg){

}
function stravaConfigured(){
  return STRAVA_CLIENT_ID !== "REPLACE_ME" && STRAVA_WORKER_URL.indexOf("REPLACE_ME") === -1;
}
function renderStravaStatus(){
  const connected = !!data.strava.refreshToken;

  document.getElementById("stravaSyncBtn").style.display = connected ? "" : "none";

  if(!stravaConfigured()){

  } else if(connected){

    stravaStatusMsg(t("strava_connected", {name}));
  } else {

document.getElementById("stravaConnectBtn").addEventListener("click", () => {

    stravaStatusMsg(t("strava_not_configured"));
    return;
  }
  const params = new URLSearchParams({

  });

async function handleStravaRedirect(){
  const params = new URLSearchParams(location.search);
  const code = params.get("code");
  const error = params.get("error");
  if(!code && !error) return;
  history.replaceState({}, "", stravaRedirectUri());
  if(error){
    stravaStatusMsg(t("strava_login_cancelled"));
    return;
  }
  if(!stravaConfigured()){
    stravaStatusMsg(t("strava_not_configured"));
    return;
  }
  try{
    stravaStatusMsg(t("strava_connecting"));
    const res = await fetch(`${STRAVA_WORKER_URL}/exchange`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({code})
    });
    if(!res.ok) throw new Error(`server responded ${res.status}`);
    const tok = await res.json();
    if(!tok.access_token) throw new Error(tok.message || "no access token in response");
    data.strava.accessToken = tok.access_token;
    data.strava.refreshToken = tok.refresh_token;
    data.strava.expiresAt = tok.expires_at;
    data.strava.athleteName = tok.athlete ? `${tok.athlete.firstname} ${tok.athlete.lastname}` : null;
    saveData();
    renderStravaStatus();
    await syncStravaRuns();
  }catch(err){
    stravaStatusMsg(t("strava_login_error", {msg: err.message}));
  }
}

async function ensureStravaToken(){
  if(!data.strava.refreshToken) return null;
  const now = Math.floor(Date.now()/1000);
  if(data.strava.accessToken && data.strava.expiresAt && data.strava.expiresAt > now + 60){
    return data.strava.accessToken;
  }
  const res = await fetch(`${STRAVA_WORKER_URL}/refresh`, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({refresh_token: data.strava.refreshToken})
  });
  if(!res.ok) throw new Error(`refresh failed (${res.status})`);
  const tok = await res.json();
  if(!tok.access_token) throw new Error(tok.message || "no access token in response");
  data.strava.accessToken = tok.access_token;
  data.strava.refreshToken = tok.refresh_token;
  data.strava.expiresAt = tok.expires_at;
  saveData();
  return data.strava.accessToken;
}

async function syncStravaRuns(){
  if(!stravaConfigured()) return;
  stravaStatusMsg(t("strava_fetching"));
  try{
    const token = await ensureStravaToken();
    if(!token) throw new Error("not connected to Strava yet");

    const after = Math.floor(Date.now()/1000) - 90*24*3600; // seneste ~90 dage
    let page = 1, allActivities = [];
    while(true){
      const res = await fetch(`${STRAVA_WORKER_URL}/activities?after=${after}&page=${page}&per_page=100`, {
        headers: {"Authorization": `Bearer ${token}`}
      });
      if(!res.ok) throw new Error(`could not fetch activities (${res.status})`);
      const batch = await res.json();
      allActivities = allActivities.concat(batch);
      if(!Array.isArray(batch) || batch.length < 100) break;
      page++;
    }

    const runs = allActivities.filter(a => a.type === "Run" || a.sport_type === "Run" || a.sport_type === "TrailRun");

    const newRunsByWeek = {};
    runs.forEach(run => {
      if(data.strava.importedIds.includes(run.id)) return;
      const dateLocal = (run.start_date_local || run.start_date).slice(0,10);
      const weekStart = toMonday(dateLocal);
      (newRunsByWeek[weekStart] = newRunsByWeek[weekStart] || []).push({run, dateLocal});
    });

    let imported = 0;
    Object.entries(newRunsByWeek).forEach(([weekStart, entries]) => {
      const week = ensureWeek(weekStart);
      entries.sort((a,b) => a.dateLocal.localeCompare(b.dateLocal));
      entries.forEach(({run, dateLocal}) => {
        const km = run.distance / 1000;
        week.trips.push({value: km.toFixed(2), date: dateLocal});
        data.strava.importedIds.push(run.id);
        imported++;
      });
    });

    saveData();
    renderAll();
    renderStravaStatus();
    stravaStatusMsg(imported > 0
      ? t("strava_imported", {
          n: imported,
          suffix: imported === 1 ? "" : "e",
          plural: imported === 1 ? "" : (lang === "da" ? "e" : "s")
        })
      : t("strava_none_new"));
  }catch(err){
    stravaStatusMsg(t("strava_error", {msg: err.message}));
  }
}

/* ---------- Sidenavigation (swipe + tilpasset rækkefølge) ---------- */
const pager = document.getElementById("pager");
const PAGE_ORDER_KEY = "lobeokonomi-page-order";
const DEFAULT_PAGE_ORDER = ["log","tools","settings","charts"];
let pageOrder = (() => {
  try{
    const saved = JSON.parse(localStorage.getItem(PAGE_ORDER_KEY));
    if(Array.isArray(saved) && saved.length === DEFAULT_PAGE_ORDER.length && DEFAULT_PAGE_ORDER.every(k => saved.includes(k))){
      return saved;
    }
  }catch(e){}
  return DEFAULT_PAGE_ORDER.slice();
})();

function getPages(){ return [...document.querySelectorAll(".page")]; }
function getNavButtons(){ return [...document.querySelectorAll(".bottombar-btn")]; }

// Flytter de fysiske DOM-elementer så de matcher pageOrder, og genberegner
// data-page-indeks på både sider og bundbjælke-knapper.
function applyPageOrder(){
  const pagesByKey = {};
  document.querySelectorAll(".page").forEach(p => pagesByKey[p.dataset.key] = p);
  const btnsByKey = {};
  document.querySelectorAll(".bottombar-btn").forEach(b => btnsByKey[b.dataset.key] = b);
  const bottomBar = document.getElementById("bottomBar");
  pageOrder.forEach((key, i) => {
    const pageEl = pagesByKey[key];
    const btnEl = btnsByKey[key];
    if(!pageEl || !btnEl) return;
    pageEl.dataset.page = i;
    btnEl.dataset.page = i;
    pager.appendChild(pageEl);
    bottomBar.appendChild(btnEl);
  });
}

function currentPageIndex(){
  if(!pager.clientWidth) return 0;
  return Math.round(pager.scrollLeft / pager.clientWidth);
}
function updatePageChromeFor(i){
  getNavButtons().forEach((b, idx) => b.classList.toggle("active", idx === i));
}
function goToPage(i){
  pager.scrollTo({left: i * pager.clientWidth, behavior: "smooth"});
  updatePageChromeFor(i); // opdatér med det samme frem for udelukkende at vente på scroll-eventet
}
function updatePageChrome(){
  updatePageChromeFor(currentPageIndex());
}
document.querySelectorAll(".bottombar-btn").forEach(b => {
  b.addEventListener("click", () => goToPage(parseInt(b.dataset.page)));
});
let pagerScrollTimeout;
pager.addEventListener("scroll", () => {
  clearTimeout(pagerScrollTimeout);
  pagerScrollTimeout = setTimeout(updatePageChrome, 60);
});

function renderPageOrderList(){
  const container = document.getElementById("pageOrderList");
  if(!container) return;
  container.innerHTML = "";
  pageOrder.forEach((key) => {
    const row = document.createElement("div");
    row.className = "page-order-item";
    row.dataset.key = key;
    row.innerHTML = `
      <span class="drag-handle">⠿</span>
      <span class="page-order-label">${t("page_" + key)}</span>
    `;
    container.appendChild(row);
  });
  attachPageOrderDrag(container);
}

// Finder den række hvis midtpunkt ligger lige under y - bruges til at afgøre
// hvor den række der trækkes skal indsættes.
function getDragRowAfter(container, y, excludeEl){
  const rows = [...container.querySelectorAll(".page-order-item")].filter(el => el !== excludeEl);
  return rows.reduce((closest, row) => {
    const box = row.getBoundingClientRect();
    const offset = y - box.top - box.height/2;
    if(offset < 0 && offset > closest.offset) return {offset, element: row};
    return closest;
  }, {offset: Number.NEGATIVE_INFINITY, element: null}).element;
}

function attachPageOrderDrag(container){
  container.querySelectorAll(".drag-handle").forEach(handle => {
    handle.addEventListener("pointerdown", e => {
      const row = handle.closest(".page-order-item");
      row.classList.add("dragging");
      handle.setPointerCapture(e.pointerId);

      const onMove = ev => {
        const afterEl = getDragRowAfter(container, ev.clientY, row);
        if(afterEl == null) container.appendChild(row);
        else container.insertBefore(row, afterEl);
      };
      const onUp = () => {
        row.classList.remove("dragging");
        document.removeEventListener("pointermove", onMove);
        document.removeEventListener("pointerup", onUp);
        pageOrder = [...container.querySelectorAll(".page-order-item")].map(r => r.dataset.key);
        localStorage.setItem(PAGE_ORDER_KEY, JSON.stringify(pageOrder));
        applyPageOrder();
        renderPageOrderList();
        // Bliv på Indstillinger-siden, uanset hvor den nu ligger i rækkefølgen
        pager.scrollTo({left: pageOrder.indexOf("settings") * pager.clientWidth, behavior: "instant"});
        updatePageChrome();
      };
      document.addEventListener("pointermove", onMove);
      document.addEventListener("pointerup", onUp);
    });
  });
}

/* ---------- Sprog/tema-knapper ---------- */
document.getElementById("langDaBtn").addEventListener("click", () => setLang("da"));
document.getElementById("langEnBtn").addEventListener("click", () => setLang("en"));
document.getElementById("themeLightBtn").addEventListener("click", () => setTheme("light"));
document.getElementById("themeDarkBtn").addEventListener("click", () => setTheme("dark"));

/* ---------- Log-/graf-indstillinger ---------- */
function renderSettingsInputs(){
  const logSelect = document.getElementById("logWeeksLimit");
  if(logSelect) logSelect.value = logWeeksLimit;

  const range = getWeekRange();
  const fromField = document.getElementById("chartFromDate");
  const toField = document.getElementById("chartToDate");
  if(fromField) fromField.value = chartRange.from || (range[0] || "");
  if(toField) toField.value = chartRange.to || (range[range.length-1] || CURRENT_WEEK_START);
}

document.getElementById("logWeeksLimit").addEventListener("change", e => {
  logWeeksLimit = e.target.value;
  localStorage.setItem(LOG_WEEKS_LIMIT_KEY, logWeeksLimit);
  renderLog();
});
document.getElementById("chartFromDate").addEventListener("change", e => {
  chartRange.from = e.target.value ? toMonday(e.target.value) : null;
  localStorage.setItem(CHART_RANGE_KEY, JSON.stringify(chartRange));
  renderCharts();
});
document.getElementById("chartToDate").addEventListener("change", e => {
  chartRange.to = e.target.value ? toMonday(e.target.value) : null;
  localStorage.setItem(CHART_RANGE_KEY, JSON.stringify(chartRange));
  renderCharts();
});
document.getElementById("chartRangeResetBtn").addEventListener("click", () => {
  chartRange = {from: null, to: null};
  localStorage.setItem(CHART_RANGE_KEY, JSON.stringify(chartRange));
  renderSettingsInputs();
  renderCharts();
});

/* ---------- init ---------- */
function renderAll(){
  renderLog();
  renderTrips();
  renderCharts();
  renderSettingsInputs();
}

document.documentElement.lang = lang;
applyTheme(localStorage.getItem(THEME_KEY) || "dark");
applyPageOrder();
applyStaticTranslations();
renderAll();
renderStravaStatus();
handleStravaRedirect();

if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(err => console.warn("Service worker registration failed:", err));
  });
}
</script>
